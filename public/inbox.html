<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Glo WhatsApp Inbox</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #1f3140; --muted: #5f6f7b; --line: #e3e8ec;
    --brand: #0a6fa3; --brand-soft: #e5f3fb; --parent: #ffffff; --bot: #eef2f5; --staff: #dcf6e6;
    --staff-ink: #0f5132; --warn: #8a5300; --warn-bg: #fff4dd; --danger: #b42318; --unread: #128c4a;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 var(--font); color: var(--ink); background: var(--bg); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #f7a51b; outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Login */
  .login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .login form { background: var(--panel); padding: 28px; border-radius: 14px; width: min(100%, 380px); display: grid; gap: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .login h1 { margin: 0; font-size: 1.35rem; }
  .login p { margin: 0; color: var(--muted); font-size: .92rem; }

  input[type=text], input[type=password], input[type=tel], textarea, select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--brand); outline: none; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--brand); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn--ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--line); }
  .btn--small { padding: 6px 10px; font-size: .85rem; }
  .err { color: var(--danger); font-size: .9rem; }

  /* App layout */
  .app { height: 100%; display: grid; grid-template-columns: 340px 1fr; }
  .list { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .list__head { padding: 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .list__title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .list__title h1 { margin: 0; font-size: 1.15rem; }
  .list__items { overflow-y: auto; flex: 1; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
  .item:hover { background: #f7fafc; }
  .item[aria-current="true"] { background: var(--brand-soft); }
  .item__name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item__time { color: var(--muted); font-size: .8rem; }
  .item__preview { color: var(--muted); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item__meta { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
  .badge { background: var(--unread); color: #fff; border-radius: 999px; font-size: .75rem; font-weight: 700; padding: 1px 7px; }
  .chip { font-size: .72rem; padding: 1px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .empty { padding: 24px; color: var(--muted); text-align: center; }

  .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .chat__head { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .chat__who { flex: 1; min-width: 0; }
  .chat__who h2 { margin: 0; font-size: 1.05rem; }
  .chat__who p { margin: 0; color: var(--muted); font-size: .85rem; }
  .back { display: none; }
  .chat__msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .day { align-self: center; font-size: .75rem; color: var(--muted); background: #e9eef2; padding: 2px 10px; border-radius: 999px; margin: 6px 0; }
  .msg { max-width: min(78%, 620px); padding: 8px 12px 6px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
  .msg small { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; text-align: right; }
  .msg--user { align-self: flex-start; background: var(--parent); border-top-left-radius: 4px; }
  .msg--model { align-self: flex-end; background: var(--bot); border-top-right-radius: 4px; }
  .msg--staff { align-self: flex-end; background: var(--staff); border-top-right-radius: 4px; }
  .msg__who { font-size: .72rem; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; }
  .msg--staff .msg__who { color: var(--staff-ink); }
  .placeholder { margin: auto; color: var(--muted); text-align: center; padding: 24px; }

  .composer { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
  .window { font-size: .85rem; padding: 6px 10px; border-radius: 8px; }
  .window--open { background: #e8f7ee; color: var(--staff-ink); }
  .window--closed { background: var(--warn-bg); color: var(--warn); }
  .composer__row { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { resize: none; min-height: 44px; max-height: 160px; }
  .tpl { display: grid; gap: 8px; grid-template-columns: 1fr 110px; }
  .tpl input[name=vars] { grid-column: 1 / -1; }
  .tpl .btn { grid-column: 1 / -1; justify-self: start; }
  .hint { font-size: .8rem; color: var(--muted); }

  dialog { border: 0; border-radius: 14px; padding: 22px; width: min(92vw, 420px); }
  dialog::backdrop { background: rgba(15,30,40,.4); }
  dialog form { display: grid; gap: 10px; }
  dialog h3 { margin: 0 0 4px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .app.is-chat .list { display: none; }
    .app:not(.is-chat) .chat { display: none; }
    .back { display: inline-flex; }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form id="loginForm">
    <h1>Glo WhatsApp Inbox</h1>
    <p>Enter the inbox key (the server's CRM_SEND_SECRET) to read and reply to parents.</p>
    <label for="keyInput" class="hint">Inbox key</label>
    <input type="password" id="keyInput" autocomplete="current-password" required>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn" type="submit">Open inbox</button>
  </form>
</section>

<main class="app" id="app" hidden>
  <aside class="list">
    <div class="list__head">
      <div class="list__title">
        <h1>WhatsApp inbox</h1>
        <div style="display:flex;gap:6px">
          <button class="btn btn--small" type="button" id="newBtn">New</button>
          <button class="btn btn--ghost btn--small" type="button" id="logoutBtn" title="Forget the key on this device">Lock</button>
        </div>
      </div>
      <input type="text" id="search" placeholder="Search name, child or number" aria-label="Search conversations">
      <p class="err" id="listErr" hidden></p>
    </div>
    <div class="list__items" id="items" role="list"></div>
  </aside>

  <section class="chat" aria-live="polite">
    <header class="chat__head" id="chatHead" hidden>
      <button class="btn btn--ghost btn--small back" type="button" id="backBtn">Back</button>
      <div class="chat__who">
        <h2 id="chatName"></h2>
        <p id="chatSub"></p>
      </div>
      <button class="btn btn--ghost btn--small" type="button" id="pauseBtn"></button>
    </header>
    <div class="chat__msgs" id="msgs"><p class="placeholder">Select a conversation to read and reply.</p></div>
    <footer class="composer" id="composer" hidden>
      <div class="window" id="windowNote"></div>
      <form class="composer__row" id="replyForm">
        <label for="replyText" class="hint" hidden>Reply</label>
        <textarea id="replyText" rows="1" placeholder="Type a reply. Enter to send, Shift+Enter for a new line"></textarea>
        <button class="btn" type="submit" id="sendBtn">Send</button>
      </form>
      <details id="tplBox">
        <summary class="hint">Send an approved template instead</summary>
        <form class="tpl" id="tplForm">
          <input type="text" name="name" placeholder="Template name, e.g. send_hi" required aria-label="Template name">
          <input type="text" name="lang" value="en" aria-label="Language code">
          <input type="text" name="vars" placeholder='Variables: comma-separated, or JSON like {"customer_name":"Priya"}' aria-label="Template variables">
          <button class="btn" type="submit">Send template</button>
        </form>
      </details>
      <p class="err" id="sendErr" hidden></p>
    </footer>
  </section>
</main>

<dialog id="newDialog">
  <form id="newForm" method="dialog">
    <h3>Message a new number</h3>
    <p class="hint">WhatsApp only allows an approved template to start a conversation.</p>
    <input type="tel" name="phone" placeholder="Phone with country code, e.g. 919876543210" required aria-label="Phone number">
    <input type="text" name="name" placeholder="Template name" required aria-label="Template name">
    <input type="text" name="lang" value="en" aria-label="Language code">
    <input type="text" name="vars" placeholder="Variables (optional)" aria-label="Template variables">
    <p class="err" id="newErr" hidden></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn--ghost" type="button" id="newCancel">Cancel</button>
      <button class="btn" type="submit">Send</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY_STORE = "glo-inbox-key";
  const WINDOW_MS = 24 * 60 * 60 * 1000;
  let key = "";
  try { key = localStorage.getItem(KEY_STORE) || ""; } catch (_) {}

  let conversations = [];
  let current = null;        // phone of the open chat
  let currentMessages = [];
  let currentPausedUntil = null;
  let listTimer = null, chatTimer = null;

  // ---------- helpers ----------
  const fmtPhone = (p) => {
    const d = String(p || "").replace(/\D/g, "");
    if (d.length === 12 && d.startsWith("91")) return "+91 " + d.slice(2, 7) + " " + d.slice(7);
    return d ? "+" + d : "";
  };
  const fmtTime = (iso) => {
    const d = new Date(iso), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay ? d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" })
                   : d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  };
  const fmtDay = (iso) => new Date(iso).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const show = (node, msg) => { node.textContent = msg || ""; node.hidden = !msg; };
  const parseVars = (raw) => {
    const t = (raw || "").trim();
    if (!t) return [];
    if (t.startsWith("{")) return JSON.parse(t);
    return t.split(",").map((s) => s.trim()).filter(Boolean);
  };

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", "x-api-key": key, ...(opts.headers || {}) },
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (res.status === 401) { lock("That key didn't work. Please enter it again."); throw new Error("unauthorized"); }
    if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
    return data;
  }

  // ---------- login ----------
  function lock(message) {
    key = "";
    try { localStorage.removeItem(KEY_STORE); } catch (_) {}
    clearInterval(listTimer); clearInterval(chatTimer);
    $("app").hidden = true; $("login").hidden = false;
    show($("loginErr"), message);
    $("keyInput").focus();
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    key = $("keyInput").value.trim();
    try {
      await api("/api/inbox/conversations?limit=1");
      try { localStorage.setItem(KEY_STORE, key); } catch (_) {}
      start();
    } catch (err) {
      if (err.message !== "unauthorized") show($("loginErr"), err.message);
    }
  });
  $("logoutBtn").addEventListener("click", () => lock(""));

  // ---------- list ----------
  async function loadList() {
    try {
      const data = await api("/api/inbox/conversations");
      conversations = data.conversations || [];
      show($("listErr"), "");
      renderList();
      const unread = conversations.reduce((n, c) => n + (c.phone === current ? 0 : c.unreadCount), 0);
      document.title = (unread ? "(" + unread + ") " : "") + "Glo WhatsApp Inbox";
    } catch (err) {
      if (err.message !== "unauthorized") show($("listErr"), "Couldn't load chats: " + err.message);
    }
  }

  function displayName(c) { return c.parentName || fmtPhone(c.phone); }

  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const box = $("items");
    box.replaceChildren();
    const rows = conversations.filter((c) =>
      !q || [c.parentName, c.childName, c.phone, fmtPhone(c.phone)].some((v) => (v || "").toLowerCase().includes(q))
    );
    if (!rows.length) { box.append(el("p", "empty", q ? "No chats match your search." : "No WhatsApp chats yet. They'll appear here as soon as a parent messages.")); return; }
    for (const c of rows) {
      const b = el("button", "item"); b.type = "button"; b.setAttribute("role", "listitem");
      b.setAttribute("aria-current", String(c.phone === current));
      b.append(el("span", "item__name", displayName(c)));
      b.append(el("span", "item__time", fmtTime(c.lastMessageAt)));
      const prefix = c.lastRole === "staff" ? "You: " : c.lastRole === "model" ? "Bot: " : "";
      b.append(el("span", "item__preview", prefix + c.lastMessage));
      const meta = el("span", "item__meta");
      if (c.pausedUntil && new Date(c.pausedUntil) > new Date()) meta.append(el("span", "chip", "Bot paused"));
      if (c.unreadCount && c.phone !== current) meta.append(el("span", "badge", String(c.unreadCount)));
      b.append(meta);
      b.addEventListener("click", () => openChat(c.phone));
      box.append(b);
    }
  }
  $("search").addEventListener("input", renderList);

  // ---------- chat ----------
  async function openChat(phone) {
    current = phone;
    currentMessages = [];
    currentPausedUntil = null;
    // Never carry an unsent draft over to a different parent.
    $("replyText").value = ""; autoGrow();
    $("tplBox").open = false;
    $("app").classList.add("is-chat");
    $("chatHead").hidden = false; $("composer").hidden = false;
    show($("sendErr"), "");
    const c = conversations.find((x) => x.phone === phone) || { phone };
    $("chatName").textContent = displayName(c);
    renderList();
    $("msgs").replaceChildren(el("p", "placeholder", "Loading…"));
    await loadChat(true);
    api("/api/inbox/conversations/" + encodeURIComponent(phone) + "/read", { method: "POST" }).then(loadList).catch(() => {});
    clearInterval(chatTimer);
    chatTimer = setInterval(() => loadChat(false), 5000);
    $("replyText").focus();
  }

  async function loadChat(scrollToEnd) {
    if (!current) return;
    const phone = current;
    try {
      const data = await api("/conversation?phone=" + encodeURIComponent(phone));
      if (phone !== current) return;
      const changed = JSON.stringify(data.messages) !== JSON.stringify(currentMessages);
      currentMessages = data.messages || [];
      currentPausedUntil = data.botPaused ? data.pausedUntil : null;
      renderHeader();
      if (changed || scrollToEnd) renderMessages(scrollToEnd || isNearBottom());
      if (changed && !scrollToEnd) api("/api/inbox/conversations/" + encodeURIComponent(phone) + "/read", { method: "POST" }).catch(() => {});
    } catch (err) {
      if (err.message === "unauthorized" || phone !== current) return;
      if (!currentMessages.length) {
        $("msgs").replaceChildren(el("p", "placeholder", "Couldn't load this chat: " + err.message + ". Retrying…"));
      } else {
        show($("sendErr"), "Couldn't refresh this chat: " + err.message);
      }
    }
  }

  function isNearBottom() { const m = $("msgs"); return m.scrollHeight - m.scrollTop - m.clientHeight < 80; }

  function lastInboundAt() {
    for (let i = currentMessages.length - 1; i >= 0; i--) if (currentMessages[i].role === "user") return currentMessages[i].createdAt;
    return null;
  }

  function renderHeader() {
    const c = conversations.find((x) => x.phone === current) || {};
    const bits = [fmtPhone(current)];
    if (c.childName) bits.push("Child: " + c.childName + (c.childAge ? " (" + c.childAge + ")" : ""));
    $("chatSub").textContent = bits.join(" · ");
    const paused = !!currentPausedUntil;
    $("pauseBtn").textContent = paused ? "Resume bot" : "Pause bot";
    $("pauseBtn").title = paused ? "Bot is quiet until " + new Date(currentPausedUntil).toLocaleString("en-IN") : "Stop the bot auto-replying to this parent for 2 hours";

    const last = lastInboundAt();
    const left = last ? WINDOW_MS - (Date.now() - new Date(last).getTime()) : -1;
    const note = $("windowNote");
    const open = left > 0;
    if (open) {
      const h = Math.floor(left / 3600000), m = Math.floor((left % 3600000) / 60000);
      note.className = "window window--open";
      note.textContent = "Reply window open for " + (h ? h + "h " : "") + m + "m. Free-text replies are allowed." + (paused ? " Bot is paused for this parent." : "");
    } else {
      note.className = "window window--closed";
      note.textContent = "The 24-hour window has closed. WhatsApp only allows an approved template until the parent writes again.";
    }
    $("replyText").disabled = !open; $("sendBtn").disabled = !open;
    $("tplBox").open = !open || $("tplBox").open;
  }

  function renderMessages(scroll) {
    const box = $("msgs");
    box.replaceChildren();
    if (!currentMessages.length) { box.append(el("p", "placeholder", "No messages yet.")); return; }
    let lastDay = "";
    const who = { user: displayName(conversations.find((x) => x.phone === current) || { phone: current }), model: "Bot", staff: "Staff" };
    for (const m of currentMessages) {
      const day = new Date(m.createdAt).toDateString();
      if (day !== lastDay) { box.append(el("div", "day", fmtDay(m.createdAt))); lastDay = day; }
      const b = el("div", "msg msg--" + m.role);
      b.append(el("span", "msg__who", who[m.role] || m.role));
      b.append(document.createTextNode(m.content));
      b.append(el("small", null, new Date(m.createdAt).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" })));
      box.append(b);
    }
    if (scroll) box.scrollTop = box.scrollHeight;
  }

  // ---------- sending ----------
  $("replyForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("replyText").value.trim();
    if (!text || !current) return;
    $("sendBtn").disabled = true; show($("sendErr"), "");
    try {
      await api("/send-message", { method: "POST", body: JSON.stringify({ phone: current, message: text }) });
      $("replyText").value = ""; autoGrow();
      await loadChat(true); loadList();
    } catch (err) {
      if (err.message !== "unauthorized") show($("sendErr"), "Not sent: " + err.message);
    } finally { $("sendBtn").disabled = false; }
  });
  $("replyText").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("replyForm").requestSubmit(); }
  });
  function autoGrow() { const t = $("replyText"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
  $("replyText").addEventListener("input", autoGrow);

  async function sendTemplate(phone, form, errNode) {
    const f = new FormData(form);
    let vars;
    try { vars = parseVars(f.get("vars")); } catch (_) { show(errNode, "Variables must be comma-separated text or valid JSON."); return false; }
    try {
      await api("/send-template", { method: "POST", body: JSON.stringify({
        phone, templateName: String(f.get("name")).trim(), languageCode: String(f.get("lang") || "en").trim(), bodyVariables: vars,
      }) });
      return true;
    } catch (err) {
      if (err.message !== "unauthorized") show(errNode, "Template not sent: " + err.message);
      return false;
    }
  }
  $("tplForm").addEventListener("submit", async (e) => {
    e.preventDefault(); show($("sendErr"), "");
    if (await sendTemplate(current, e.target, $("sendErr"))) { e.target.reset(); await loadChat(true); loadList(); }
  });

  $("pauseBtn").addEventListener("click", async () => {
    if (!current) return;
    try {
      await api("/api/inbox/conversations/" + encodeURIComponent(current) + "/pause", { method: "POST", body: JSON.stringify({ minutes: currentPausedUntil ? 0 : 120 }) });
      await loadChat(false); loadList();
    } catch (err) { if (err.message !== "unauthorized") show($("sendErr"), err.message); }
  });

  $("backBtn").addEventListener("click", () => {
    current = null; clearInterval(chatTimer);
    $("app").classList.remove("is-chat"); renderList();
  });

  // New conversation via template
  $("newBtn").addEventListener("click", () => { show($("newErr"), ""); $("newDialog").showModal(); });
  $("newCancel").addEventListener("click", () => $("newDialog").close());
  $("newForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const phone = String(new FormData(e.target).get("phone")).replace(/\D/g, "");
    if (phone.length < 10) { show($("newErr"), "Enter the number with country code, e.g. 919876543210."); return; }
    if (await sendTemplate(phone, e.target, $("newErr"))) {
      $("newDialog").close(); e.target.reset(); await loadList(); openChat(phone);
    }
  });

  function start() {
    $("login").hidden = true; $("app").hidden = false;
    loadList();
    clearInterval(listTimer);
    listTimer = setInterval(loadList, 10000);
  }

  if (key) start(); else lock("");
})();
</script>
</body>
</html>
